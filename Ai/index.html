<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGen — Karachi Maps Prospecting Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --whatsapp: #22c55e;
            --whatsapp-hover: #16a34a;
            --map-btn: #38bdf8;
            --map-hover: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: flex-end;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select, input {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        button.btn-search {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            height: 46px;
        }

        button.btn-search:hover {
            background: var(--accent-hover);
        }

        .status-container {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .leads-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lead-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .lead-info h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .lead-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-whatsapp:hover {
            background: var(--whatsapp-hover);
        }

        .btn-map {
            background: transparent;
            border: 1px solid var(--map-btn);
            color: var(--map-btn);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-map:hover {
            background: var(--map-btn);
            color: #0f172a;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Karachi Maps Lead Generator</h1>
            <p>Target local businesses without websites across different areas of Karachi</p>
        </header>

        <div class="search-card">
            <div class="form-grid">
                <!-- Area Selector -->
                <div class="form-group">
                    <label for="location">Karachi Area</label>
                    <select id="location">
                        <option value="Landhi, Karachi" selected>Landhi</option>
                        <option value="Korangi, Karachi">Korangi</option>
                        <option value="Gulshan-e-Iqbal, Karachi">Gulshan-e-Iqbal</option>
                        <option value="Gulistan-e-Jauhar, Karachi">Gulistan-e-Jauhar</option>
                        <option value="North Nazimabad, Karachi">North Nazimabad</option>
                        <option value="Federal B Area, Karachi">F.B. Area</option>
                        <option value="DHA, Karachi">DHA</option>
                        <option value="Clifton, Karachi">Clifton</option>
                        <option value="PECHS, Karachi">PECHS</option>
                        <option value="Sadhtar, Karachi">Saddar</option>
                    </select>
                </div>

                <!-- Category Selector -->
                <div class="form-group">
                    <label for="businessType">Business Category</label>
                    <select id="businessType">
                        <option value="gym" selected>Gym & Fitness Club</option>
                        <option value="clinic">Medical Clinic / Doctor</option>
                        <option value="dental clinic">Dental Clinic</option>
                        <option value="salon">Beauty Salon / Parlor</option>
                        <option value="restaurant">Restaurant / Fast Food</option>
                        <option value="cafe">Cafe / Coffee Shop</option>
                        <option value="supermarket">Supermarket / Grocery</option>
                        <option value="bakery">Bakery & Sweets</option>
                    </select>
                </div>

                <button class="btn-search" id="searchBtn" onclick="searchLeads()">Search Leads</button>
            </div>
        </div>

        <div class="status-container" id="statusContainer">
            <div class="spinner"></div>
            <p id="statusText">Deep scanning Google Maps for selected area (takes ~20-25s)...</p>
        </div>

        <div id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Prospect List</h2>
                <span class="results-count" id="resultsCount">Found 0 businesses</span>
            </div>
            <div class="leads-list" id="leadsList"></div>
        </div>
    </div>

    <script>
        async function searchLeads() {
            const location = document.getElementById('location').value;
            const businessType = document.getElementById('businessType').value;

            const statusContainer = document.getElementById('statusContainer');
            const resultsSection = document.getElementById('resultsSection');
            const leadsList = document.getElementById('leadsList');
            const resultsCount = document.getElementById('resultsCount');
            const searchBtn = document.getElementById('searchBtn');

            statusContainer.style.display = 'block';
            resultsSection.style.display = 'none';
            searchBtn.disabled = true;
            searchBtn.style.opacity = '0.6';

            try {
                const response = await fetch(`/fetch-leads?location=${encodeURIComponent(location)}&business_type=${encodeURIComponent(businessType)}`);
                const data = await response.json();

                leadsList.innerHTML = '';

                if (data.status === 'success' && data.leads.length > 0) {
                    resultsCount.innerText = `Found ${data.total_found_without_website} business(es) without a website`;
                    
                    data.leads.forEach(lead => {
                        const card = document.createElement('div');
                        card.className = 'lead-card';
                        
                        const waNumber = lead.whatsapp_phone || lead.phone_number.replace(/[^0-9]/g, '');
                        const waText = encodeURIComponent(`Hi ${lead.business_name}, I saw your business on Google Maps in ${location} and noticed you don't have an official website. We build custom websites for local businesses to get more clients. Are you available for a quick chat?`);
                        const waUrl = `https://wa.me/${waNumber}?text=${waText}`;
                        
                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(lead.business_name + ' ' + location)}`;

                        card.innerHTML = `
                            <div class="lead-info">
                                <h3>${lead.business_name}</h3>
                                <p><strong>Phone:</strong> ${lead.phone_number}</p>
                                <p><strong>Address:</strong> ${lead.address}</p>
                            </div>
                            <div class="action-buttons">
                                <a href="${mapUrl}" target="_blank" class="btn-map">
                                    View Map
                                </a>
                                <a href="${waUrl}" target="_blank" class="btn-whatsapp">
                                    WhatsApp
                                </a>
                            </div>
                        `;
                        leadsList.appendChild(card);
                    });
                } else {
                    resultsCount.innerText = 'Found 0 businesses without websites';
                    leadsList.innerHTML = `
                        <div class="empty-state">
                            No businesses missing websites were found matching your search parameters.
                        </div>
                    `;
                }

                resultsSection.style.display = 'block';
            } catch (err) {
                alert('Failed to connect to backend server. Make sure FastAPI server is running.');
                console.error(err);
            } finally {
                statusContainer.style.display = 'none';
                searchBtn.disabled = false;
                searchBtn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
